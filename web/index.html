<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClawFeed</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Arctic Theme: CSS Custom Properties ── */
  :root {
    --arctic-bg: #0a1628;
    --arctic-bg-elevated: #0f1d32;
    --arctic-card: rgba(15, 29, 50, 0.7);
    --arctic-card-hover: rgba(20, 38, 65, 0.8);
    --arctic-border: rgba(56, 189, 248, 0.12);
    --arctic-border-hover: rgba(56, 189, 248, 0.25);
    --arctic-text: #e0eaf5;
    --arctic-text-secondary: #8ba3c4;
    --arctic-text-muted: #5a7a9e;
    --arctic-accent: #38bdf8;
    --arctic-accent-dim: rgba(56, 189, 248, 0.15);
    --arctic-frost: #67e8f9;
    --arctic-aurora-green: #34d399;
    --arctic-aurora-green-dim: rgba(52, 211, 153, 0.15);
    --arctic-aurora-amber: #fbbf24;
    --arctic-aurora-amber-dim: rgba(251, 191, 36, 0.15);
    --arctic-aurora-red: #f87171;
    --arctic-aurora-red-dim: rgba(248, 113, 113, 0.12);
    --arctic-surface: rgba(56, 189, 248, 0.06);
    --arctic-input-bg: rgba(10, 22, 40, 0.8);
    --arctic-glow: 0 0 20px rgba(56, 189, 248, 0.08);
    --arctic-radius: 12px;
    --arctic-radius-sm: 8px;
    --arctic-radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--arctic-bg); color: var(--arctic-text); word-break: break-word; transition: background .3s, color .3s; }
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 400px; background: radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, 0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }

  /* ── Light mode overrides ── */
  body.light { --arctic-bg: #eef4fa; --arctic-bg-elevated: #f5f9fd; --arctic-card: rgba(255,255,255,0.85); --arctic-card-hover: rgba(255,255,255,0.95); --arctic-border: rgba(56, 130, 200, 0.15); --arctic-border-hover: rgba(56, 130, 200, 0.3); --arctic-text: #0f2744; --arctic-text-secondary: #4a6a8a; --arctic-text-muted: #8a9ab0; --arctic-surface: rgba(56, 189, 248, 0.08); --arctic-input-bg: rgba(255,255,255,0.9); --arctic-glow: 0 0 20px rgba(56, 189, 248, 0.06); background: var(--arctic-bg); color: var(--arctic-text); }
  body.light::before { background: radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 70%); }
  body.light .toast { background: #1e3a5f; }
  body.light .changelog-overlay { background: rgba(238,244,250,0.95); }
  body.light .changelog-inner { color: var(--arctic-text); }
  body.light .changelog-inner h1 { color: var(--arctic-text); }
  body.light .changelog-inner h2 { color: var(--arctic-accent); border-color: var(--arctic-border); }
  body.light .changelog-inner h3 { color: var(--arctic-text-secondary); }
  body.light .changelog-inner li { color: var(--arctic-text-secondary); }
  body.light .changelog-inner code { background: var(--arctic-accent-dim); color: #0369a1; }

  /* ── Theme toggle ── */
  .theme-toggle { background: var(--arctic-surface); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius-xs); cursor: pointer; font-size: 16px; padding: 4px 8px; line-height: 1; transition: all .2s; color: var(--arctic-text-muted); backdrop-filter: blur(8px); }
  .theme-toggle:hover { border-color: var(--arctic-border-hover); color: var(--arctic-accent); }

  /* ── Container ── */
  .container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
  h1 { font-size: 1.8em; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.02em; }
  @media (max-width: 480px) { h1 { font-size: 1.3em; } }

  /* ── Subtitle ── */
  .subtitle { color: var(--arctic-text-muted); margin-bottom: 24px; font-size: 0.85em; letter-spacing: 0.5px; text-transform: uppercase; }
  .subtitle .agent-name { font-weight: 600; padding: 2px 8px; border-radius: 4px; text-decoration: none; transition: opacity 0.2s; }
  .subtitle .agent-name:hover { opacity: 0.85; }
  .subtitle .agent-name.zylos { background: linear-gradient(135deg, #818cf8, #6366f1); color: #fff; }
  .subtitle .agent-name.openclaw { background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; }

  /* ── Changelog modal ── */
  .changelog-overlay { position:fixed; inset:0; background:rgba(10,22,40,0.92); backdrop-filter:blur(8px); z-index:9999; overflow-y:auto; display:none; }
  .changelog-overlay.open { display:flex; justify-content:center; }
  .changelog-inner { max-width:750px; width:100%; padding:40px 24px 60px; color:var(--arctic-text); position:relative; }
  .changelog-close { position:fixed; top:16px; right:24px; font-size:28px; color:var(--arctic-text-muted); cursor:pointer; z-index:10000; background:none; border:none; }
  .changelog-close:hover { color:var(--arctic-accent); }
  .changelog-inner h1 { font-size:2em; margin-bottom:24px; color:var(--arctic-text); }
  .changelog-inner h2 { font-size:1.4em; margin:32px 0 8px; color:var(--arctic-accent); border-bottom:1px solid var(--arctic-border); padding-bottom:8px; }
  .changelog-inner h3 { font-size:1.1em; margin:16px 0 8px; color:var(--arctic-text-secondary); }
  .changelog-inner ul { margin:0 0 8px 20px; }
  .changelog-inner li { margin:4px 0; line-height:1.6; color:var(--arctic-text-secondary); }
  .changelog-inner code { background:var(--arctic-accent-dim); padding:2px 6px; border-radius:3px; font-size:0.9em; color:var(--arctic-accent); }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; border-radius: 20px; background: var(--arctic-surface); border: 1px solid transparent; cursor: pointer; color: var(--arctic-text-muted); font-size: 13px; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--arctic-text); background: var(--arctic-accent-dim); border-color: var(--arctic-border); }
  .tab.active { background: var(--arctic-accent-dim); border-color: var(--arctic-accent); color: var(--arctic-accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.1); }

  /* ── Digest list ── */
  .digest-list { display: flex; flex-direction: column; gap: 10px; }
  .date-group { margin-bottom: 8px; }
  .date-group-header { font-size: 12px; color: var(--arctic-text-muted); font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; padding: 10px 0 8px; border-bottom: 1px solid var(--arctic-border); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .date-group-header .count { font-size: 11px; color: var(--arctic-text-muted); font-weight: 400; opacity: 0.6; }
  .date-group-items { display: flex; flex-direction: column; gap: 8px; }

  /* ── Digest card ── */
  .digest-card { background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 14px 18px; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .digest-card:hover { border-color: var(--arctic-border-hover); background: var(--arctic-card-hover); box-shadow: var(--arctic-glow); transform: translateY(-1px); }
  .digest-card .card-body { flex: 1; min-width: 0; }
  .digest-card .title { font-size: 14px; font-weight: 500; }
  .digest-card .excerpt { font-size: 12px; color: var(--arctic-text-secondary); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.6; }
  .digest-card .time-badge { font-size: 11px; color: var(--arctic-accent); background: var(--arctic-accent-dim); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(56,189,248,0.1); white-space: nowrap; font-weight: 500; }

  /* ── Digest viewer ── */
  .digest-viewer { display: none; background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 24px; margin-top: 16px; line-height: 1.7; white-space: normal; word-break: break-word; overflow-wrap: break-word; font-size: 14px; max-height: 80vh; overflow-y: auto; overflow-x: hidden; }
  .digest-viewer a { color: var(--arctic-accent); text-decoration: none; }
  .digest-viewer a:hover { text-decoration: underline; }
  .digest-viewer h1, .digest-viewer h2, .digest-viewer h3 { color: var(--arctic-text); margin: 16px 0 8px; }
  .digest-viewer p { margin: 0 0 12px; }
  .digest-viewer ul, .digest-viewer ol { margin: 0 0 12px 1.2em; padding-left: 0; }
  .digest-viewer li { margin-bottom: 6px; line-height: 1.6; }
  .digest-viewer blockquote { border-left: 3px solid var(--arctic-accent); margin: 0 0 12px; padding-left: 12px; color: var(--arctic-text-secondary); }
  .digest-viewer pre { background: var(--arctic-input-bg); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius-sm); padding: 12px; margin: 0 0 16px; overflow-x: auto; font-size: 13px; }

  /* ── Back button ── */
  .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 6px 14px; background: var(--arctic-surface); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius-xs); color: var(--arctic-text-secondary); cursor: pointer; font-size: 13px; transition: all .2s; }
  .back-btn:hover { color: var(--arctic-accent); border-color: var(--arctic-border-hover); }

  /* ── Empty / Loading ── */
  .empty { color: var(--arctic-text-muted); text-align: center; padding: 40px; font-size: 14px; }
  .loading { color: var(--arctic-text-muted); text-align: center; padding: 20px; }

  /* ── Mark button ── */
  .mark-btn { display: inline-block; margin-left: 6px; padding: 1px 8px; font-size: 11px; background: var(--arctic-surface); border: 1px solid var(--arctic-border); border-radius: 4px; color: var(--arctic-aurora-amber); cursor: pointer; vertical-align: middle; transition: all .15s; text-decoration: none; }
  .mark-btn:hover { background: var(--arctic-aurora-amber-dim); border-color: var(--arctic-aurora-amber); text-decoration: none; }
  .mark-btn.marked { color: var(--arctic-aurora-green); border-color: var(--arctic-aurora-green); cursor: default; }
  .mark-btn.disabled { color: var(--arctic-text-muted); border-color: var(--arctic-border); cursor: pointer; opacity: .6; }
  .mark-btn.disabled:hover { background: var(--arctic-surface); border-color: var(--arctic-border-hover); }

  /* ── Login prompt ── */
  .login-prompt { text-align: center; padding: 60px 20px; }
  .login-prompt .icon { font-size: 48px; margin-bottom: 16px; }
  .login-prompt .msg { color: var(--arctic-text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
  .login-prompt .auth-btn { display: inline-block; padding: 10px 24px; font-size: 14px; }

  /* ── Login banner ── */
  .login-banner { background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 10px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--arctic-text-secondary); }
  .login-banner a { color: var(--arctic-accent); text-decoration: none; }
  .login-banner a:hover { text-decoration: underline; }
  .login-banner .dismiss { cursor: pointer; color: var(--arctic-text-muted); font-size: 16px; padding: 0 4px; line-height: 1; }
  .login-banner .dismiss:hover { color: var(--arctic-text); }

  /* ── Auth bar ── */
  .auth-bar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .auth-tools { display: flex; align-items: center; gap: 6px; padding-left: 8px; border-left: 1px solid var(--arctic-border); margin-left: 2px; }
  .auth-bar img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--arctic-border); }
  .auth-bar .user-name { font-size: 13px; color: var(--arctic-text-secondary); }
  .user-menu { position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .user-dropdown { display: none; position: absolute; top: 100%; right: 0; margin-top: 6px; background: var(--arctic-bg-elevated); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius-sm); padding: 6px 0; min-width: 120px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.3); backdrop-filter: blur(16px); }
  .user-dropdown.show { display: block; }
  .user-dropdown a { display: flex; align-items: center; gap: 8px; padding: 8px 16px; color: var(--arctic-text-secondary); text-decoration: none; font-size: 13px; transition: all .15s; }
  .user-dropdown a:hover { background: var(--arctic-accent-dim); color: var(--arctic-accent); }
  .auth-btn { padding: 6px 14px; border-radius: var(--arctic-radius-xs); border: 1px solid var(--arctic-border); background: var(--arctic-surface); color: var(--arctic-text-secondary); cursor: pointer; font-size: 12px; text-decoration: none; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; backdrop-filter: blur(8px); }
  .auth-btn:hover { border-color: var(--arctic-accent); color: var(--arctic-accent); }
  .auth-btn .g-logo { width:14px;height:14px; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--arctic-bg-elevated); color: var(--arctic-text); padding: 10px 20px; border-radius: var(--arctic-radius-sm); border: 1px solid var(--arctic-border); font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; backdrop-filter: blur(12px); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .toast.show { opacity: 1; }

  /* ── Mark card ── */
  .mark-card { background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 16px 20px; transition: all 0.25s ease; }
  .mark-card:hover { border-color: var(--arctic-border-hover); background: var(--arctic-card-hover); box-shadow: var(--arctic-glow); }
  .mark-card .mark-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .mark-card .mark-date { font-size: 12px; color: var(--arctic-text-muted); }
  .mark-card .mark-status { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .mark-card .mark-status.pending { background: var(--arctic-aurora-amber-dim); color: var(--arctic-aurora-amber); }
  .mark-card .mark-status.done { background: var(--arctic-aurora-green-dim); color: var(--arctic-aurora-green); }
  .mark-card .mark-author { font-size: 14px; font-weight: 600; color: var(--arctic-accent); }
  .mark-card .mark-link { margin-top: 6px; }
  .mark-card .mark-link a { font-size: 12px; color: var(--arctic-text-muted); text-decoration: none; word-break: break-all; }
  .mark-card .mark-link a:hover { color: var(--arctic-accent); text-decoration: underline; }

  /* ── Mark stats ── */
  .mark-stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .mark-stat { background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 16px; flex: 1; text-align: center; }
  .mark-stat .num { font-size: 24px; font-weight: 700; color: var(--arctic-accent); }
  .mark-stat .label { font-size: 12px; color: var(--arctic-text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── Source card ── */
  .source-card { background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 16px 20px; transition: all 0.25s ease; }
  .source-card:hover { border-color: var(--arctic-border-hover); background: var(--arctic-card-hover); box-shadow: var(--arctic-glow); }
  .source-card .source-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .source-card .source-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .source-card .source-meta { font-size: 12px; color: var(--arctic-text-muted); margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* ── Source actions ── */
  .source-actions { display: flex; gap: 6px; align-items: center; }
  .source-actions button { padding: 4px 10px; font-size: 12px; background: var(--arctic-surface); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius-xs); color: var(--arctic-text-secondary); cursor: pointer; transition: all .2s; }
  .source-actions button:hover { border-color: var(--arctic-accent); color: var(--arctic-accent); }
  .source-actions button.danger:hover { border-color: var(--arctic-aurora-red); color: var(--arctic-aurora-red); }

  /* ── Toggle switch ── */
  .toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: rgba(56,189,248,0.1); border: 1px solid var(--arctic-border); border-radius: 20px; transition: .3s; }
  .toggle-slider:before { content: ''; position: absolute; height: 14px; width: 14px; left: 2px; bottom: 2px; background: var(--arctic-text-muted); border-radius: 50%; transition: .3s; }
  .toggle-switch input:checked + .toggle-slider { background: var(--arctic-aurora-green-dim); border-color: rgba(52,211,153,0.3); }
  .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); background: var(--arctic-aurora-green); }

  /* ── Source form ── */
  .source-form { background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 20px; margin-bottom: 16px; }
  .source-form .form-row { margin-bottom: 12px; }
  .source-form label { display: block; font-size: 11px; color: var(--arctic-text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
  .source-form input, .source-form select, .source-form textarea { width: 100%; padding: 8px 12px; background: var(--arctic-input-bg); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius-xs); color: var(--arctic-text); font-size: 13px; font-family: inherit; transition: border-color .2s; }
  .source-form input:focus, .source-form select:focus, .source-form textarea:focus { outline: none; border-color: var(--arctic-accent); box-shadow: 0 0 0 2px rgba(56,189,248,0.1); }
  .source-form textarea { min-height: 60px; resize: vertical; font-family: 'Fira Code', monospace; }
  .source-form .form-actions { display: flex; gap: 8px; margin-top: 16px; }
  .source-form .form-actions button { padding: 8px 20px; border-radius: var(--arctic-radius-xs); border: 1px solid var(--arctic-border); background: var(--arctic-surface); color: var(--arctic-text-secondary); cursor: pointer; font-size: 13px; transition: all .2s; font-weight: 500; }
  .source-form .form-actions button.primary { background: var(--arctic-aurora-green-dim); border-color: rgba(52,211,153,0.3); color: var(--arctic-aurora-green); }
  .source-form .form-actions button.primary:hover { background: rgba(52,211,153,0.25); border-color: var(--arctic-aurora-green); }
  .source-form .form-actions button:hover { border-color: var(--arctic-border-hover); color: var(--arctic-text); }

  /* ── Pack card ── */
  .pack-card { background: var(--arctic-card); backdrop-filter: blur(12px); border: 1px solid var(--arctic-border); border-radius: var(--arctic-radius); padding: 16px 20px; transition: all 0.25s ease; }
  .pack-card:hover { border-color: var(--arctic-border-hover); background: var(--arctic-card-hover); box-shadow: var(--arctic-glow); }
  .pack-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .pack-name { font-size: 16px; font-weight: 600; }
  .pack-desc { font-size: 13px; color: var(--arctic-text-secondary); margin-top: 4px; }
  .pack-meta { display: flex; gap: 12px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--arctic-text-muted); flex-wrap: wrap; }
  .pack-meta img { width: 20px; height: 20px; border-radius: 50%; }
  .pack-sources-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pack-source-tag { font-size: 11px; padding: 3px 8px; background: var(--arctic-surface); border: 1px solid var(--arctic-border); border-radius: 20px; color: var(--arctic-text-secondary); }
  .pack-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .pack-actions button { padding: 6px 16px; font-size: 12px; border-radius: var(--arctic-radius-xs); cursor: pointer; transition: all .2s; font-weight: 500; }
  .pack-install-btn { background: var(--arctic-aurora-green-dim); border: 1px solid rgba(52,211,153,0.3); color: var(--arctic-aurora-green); }
  .pack-install-btn:hover { background: rgba(52,211,153,0.25); border-color: var(--arctic-aurora-green); }
  .pack-install-btn.done { background: var(--arctic-surface); border-color: var(--arctic-border); color: var(--arctic-text-muted); cursor: default; }
  .pack-delete-btn { background: var(--arctic-surface); border: 1px solid var(--arctic-border); color: var(--arctic-text-secondary); }
  .pack-delete-btn:hover { border-color: var(--arctic-aurora-red); color: var(--arctic-aurora-red); }
  .pack-detail-page { max-width: 700px; margin: 0 auto; }

function initTheme() {
  const saved = localStorage.getItem('clawfeed_theme') || 'dark';
  if (saved === 'light') document.body.classList.add('light');
  updateThemeIcon();
}
function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  localStorage.setItem('clawfeed_theme', isLight ? 'light' : 'dark');
  updateThemeIcon();
}
function updateThemeIcon() {
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
}

function parseChangelogMd(md) {
  return md.split('\n').map(line => {
    // headers
    if (line.startsWith('### ')) return `<h3>${esc(line.slice(4))}</h3>`;
    if (line.startsWith('## ')) return `<h2>${esc(line.slice(3))}</h2>`;
    if (line.startsWith('# ')) return `<h1>${esc(line.slice(2))}</h1>`;
    // list items with bold and code
    if (line.startsWith('- ')) {
      let content = esc(line.slice(2));
      content = content.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      content = content.replace(/`([^`]+)`/g, '<code>$1</code>');
      return `<li>${content}</li>`;
    }
    if (line.trim() === '') return '';
    return `<p>${esc(line)}</p>`;
  }).join('\n')
    .replace(/(<li>)/g, m => m) // wrap consecutive li in ul
    .replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function WEEKDAYS() { return t('weekdays'); }
let appTimezone = 'UTC';
let currentType = '4h';
let markedUrls = new Map(); // url → mark id
const PAGE_SIZE = 10;
let currentOffset = 0;
let allLoaded = false;

function parseCreatedAt(d) {
  const ca = d.created_at;
  // Handle week format: "2026-W07"
  if (/^\d{4}-W\d{2}$/.test(ca)) {
    const [y, w] = ca.split('-W').map(Number);
    // Approximate: week 1 starts Jan 1
    const jan1 = new Date(y, 0, 1);
    return new Date(jan1.getTime() + (w - 1) * 7 * 86400000);
  }
  // Handle month format: "2026-02"
  if (/^\d{4}-\d{2}$/.test(ca)) {
    return new Date(ca + '-01T00:00:00Z');
  }
  // Handle year format: "2026"
  if (/^\d{4}$/.test(ca)) {
    return new Date(ca + '-01-01T00:00:00Z');
  }
  return new Date(ca.replace(' ', 'T') + (ca.includes('+') ? '' : 'Z'));
}

function getWeekKey(dt) {
  const d = new Date(dt); d.setHours(0,0,0,0);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const days = Math.floor((d - jan1) / 86400000);
  const week = Math.ceil((days + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2, '0')}`;
}

function groupDigests(digests) {
  const groups = {}; const order = [];
  function localDateStr(dt) { return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
  function localMonthStr(dt) { return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`; }
  for (const d of digests) {
    const dt = parseCreatedAt(d);
    let key;
    if (currentType === '4h') {
      key = localDateStr(dt); // by local day
    } else if (currentType === 'daily') {
      key = getWeekKey(dt); // by week
    } else if (currentType === 'weekly') {
      key = localMonthStr(dt); // by local month
    } else {
      key = String(dt.getFullYear()); // by local year
    }
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push({ ...d, _dt: dt });
  }
  return { groups, order };
}

function formatGroupLabel(type, key) {
  if (type === '4h') {
    const d = new Date(key + 'T12:00:00Z');
    const wdIdx = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(
      new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: appTimezone }).format(d)
    );
    const wd = WEEKDAYS()[wdIdx >= 0 ? wdIdx : d.getDay()];
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((today - new Date(d.toDateString())) / 86400000);
    if (diff === 0) return `📅 ${t('today')} · ${key} ${wd}`;
    if (diff === 1) return `📅 ${t('yesterday')} · ${key} ${wd}`;
    return `📅 ${key} ${wd}`;
  }
  if (type === 'daily') {
    const [y, w] = key.split('-W');
    return t('weekLabel')(y, parseInt(w));
  }
  if (type === 'weekly') {
    const [y, m] = key.split('-');
    return t('monthLabel')(y, parseInt(m));
  }
  if (type === 'monthly') {
    return t('yearLabel')(key);
  }
  return `📅 ${key}`;
}

function extractExcerpt(content) {
  if (!content) return '';
  const lines = content.split('\n');
  const highlights = [];
  let inImportant = false;
  for (const line of lines) {
    const trimmed = line.trim();
    // Detect 🔥重要 section
    if (trimmed.includes('🔥')) { inImportant = true; continue; }
    // Stop at next section header
    if (inImportant && (trimmed.startsWith('📰') || trimmed.startsWith('🔖') || trimmed.startsWith('🔍') || trimmed.startsWith('👀') || trimmed.startsWith('🧹') || trimmed.startsWith('💤'))) break;
    if (inImportant && trimmed.startsWith('•')) {
      let clean = trimmed.replace(/^•\s*/, '').replace(/\*\*/g, '').replace(/https?:\/\/\S+/g, '').replace(/（来源[^）]*）/g, '').trim();
      if (clean.length > 8) highlights.push(clean.length > 80 ? clean.slice(0, 80) + '…' : clean);
      if (highlights.length >= 2) break;
    }
  }
  if (highlights.length) return highlights.join(' · ');
  // Fallback: find first bullet with substance
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('>') || trimmed === '---' || /^[☀️🔥📰📅]/.test(trimmed) || trimmed.startsWith('*基于')) continue;
    let clean = trimmed.replace(/^[•\-\*]\s*/, '').replace(/\*\*/g, '').replace(/https?:\/\/\S+/g, '').trim();
    if (clean.length > 15) return clean.length > 120 ? clean.slice(0, 120) + '…' : clean;
  }
  return '';
}

async function renderList(append = false) {
  const list = document.getElementById('list');
  const viewer = document.getElementById('viewer');
  viewer.style.display = 'none';

  if (currentType === 'marks') { renderMarks(); return; }
  if (currentType === 'sources') { renderSources(); return; }
  if (currentType === 'groups') { renderGroups(); return; }
  if (currentType === 'prompts') { renderPrompts(); return; }
  if (currentType === 'settings') { renderSettings(); return; }

  if (!append) {
    currentOffset = 0;
    allLoaded = false;
    loadedDigests = [];
    list.innerHTML = `<div class="loading">${t('loading')}</div>`;
  }

  try {
    const resp = await fetch(`${API}/digests?type=${currentType}&limit=${PAGE_SIZE}&offset=${currentOffset}`);
    const digests = await resp.json();
    if (digests.length < PAGE_SIZE) allLoaded = true;
    loadedDigests = loadedDigests.concat(digests);
    currentOffset += digests.length;

    if (!loadedDigests.length) { list.innerHTML = `<div class="empty">${t('noData')}</div>`; return; }

    const { groups, order } = groupDigests(loadedDigests);
    let html = '';
    for (const gk of order) {
      const items = groups[gk];
      const label = formatGroupLabel(currentType, gk);
      html += `<div class="date-group"><div class="date-group-header">${label} <span class="count">${items.length} ${t('articles')}</span></div><div class="date-group-items">`;
      for (const d of items) {
        const dt = d._dt;
        const time = dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: appTimezone });
        let title, badge;
        if (currentType === '4h') {
          title = time; badge = `<span class="time-badge">${time}</span>`;
        } else if (currentType === 'daily') {
          const dateStr = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: appTimezone }).format(dt);
          const wdIdx2 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: appTimezone }).format(dt));
          const wd = WEEKDAYS()[wdIdx2 >= 0 ? wdIdx2 : dt.getDay()];
          title = `${dateStr} ${wd}`; badge = '';
        } else if (currentType === 'weekly') {
          const wk = getWeekKey(dt);
          title = `第 ${parseInt(wk.split('-W')[1])} 周`; badge = '';
        } else {
          const mon = dt.toISOString().slice(0, 7);
          title = `${parseInt(mon.split('-')[1])} 月`; badge = '';
        }
        const excerpt = extractExcerpt(d.content);
        const groupBadge = d.group_name ? ` <span style="font-size:11px;color:var(--arctic-aurora-green);background:var(--arctic-aurora-green-dim);padding:1px 6px;border-radius:3px;margin-left:4px;" title="Group: ${d.group_name}">🏷️ ${d.group_name}</span>` : '';
        html += `<div class="digest-card" data-id="${d.id}"><div class="card-body"><div class="title">${title}${groupBadge}</div>${excerpt ? `<div class="excerpt">${excerpt}</div>` : ''}</div>${badge}</div>`;
      }
      html += `</div></div>`;
    }
    if (!allLoaded) {
      html += `<div id="load-more" style="text-align:center;padding:16px;"><button onclick="loadMore()" style="padding:10px 32px;background:var(--arctic-surface);border:1px solid var(--arctic-border);border-radius:8px;color:var(--arctic-text-secondary);cursor:pointer;font-size:14px;transition:all .2s;">${t('loadMore')}</button></div>`;
    }
    list.innerHTML = html;
    list.querySelectorAll('.digest-card').forEach(card => {
      card.onclick = () => loadDigest(card.dataset.id);
    });
  } catch (e) {
    if (!append) list.innerHTML = `<div class="empty">${t('loadFail')}: ${e.message}</div>`;
  }
}

  list.innerHTML = '';
  try {
    const resp = await fetch(`${API}/digests/${id}`);
    const d = await resp.json();
    let text = d.content;
    // Hide private sections for non-logged-in users
    if (!currentUser) {
      text = text.replace(/🧹\s*建议取关[\s\S]*?(?=\n(?:💤|🔍|👀|📰|🔖|🔥|—|$))/g, '');
      text = text.replace(/🔖\s*Bookmarks\s*精选[\s\S]*?(?=\n(?:💤|🔍|👀|📰|🧹|🔥|—|$))/g, '');
    }
    await loadMarkedUrls();

    text = text.replace(/(https?:\/\/x\.com\/[^\s<)]+)/g, (match) => {
      const clean = match.split('?')[0];
      const isMarked = markedUrls.has(clean);
      const markId = markedUrls.get(clean);
      let markHtml;
      if (currentUser) {
        markHtml = isMarked
          ? `<span class="mark-btn marked" onclick="doUnmark('${clean}', ${markId}, this)">${t('marked')}</span>`
          : `<span class="mark-btn" onclick="doMark('${clean}', this)">${t('mark')}</span>`;
      } else {
        markHtml = `<span class="mark-btn disabled" onclick="showToast('${t('loginToMark')}')" title="${t('loginToMark')}">${t('mark')}</span>`;
      }
      return `<a href="${match}" target="_blank">${match}</a>${markHtml}`;
    });
    text = text.replace(/(https?:\/\/(?!x\.com)[^\s<)]+)/g, '<a href="$1" target="_blank">$1</a>');

    const markdownHtml = typeof marked !== 'undefined'
      ? marked.parse(text)
      : `<pre>${esc(text)}</pre>`;
    viewer.innerHTML = `<div class="back-btn" onclick="renderList()">${t('back')}</div>${markdownHtml}`;
    viewer.style.display = 'block';
  } catch (e) {
    viewer.innerHTML = `<div class="back-btn" onclick="renderList()">${t('back')}</div>\n<div class="empty">${t('cantLoad')}</div>`;
    viewer.style.display = 'block';
  }
}

let markViewMode = 'topic'; // 'topic' or 'time'

function getMarkTopic(m) {
  return m.title || '其他';
}

async function renderMarks() {
  const list = document.getElementById('list');
  if (!currentUser) {
    list.innerHTML = authEnabled ? `<div class="login-prompt">
      <div class="icon">🔐</div>
      <div class="msg">${t('loginPromptTitle')}<br>${t('loginPromptDesc')}</div>
      <a class="auth-btn" href="${API}/auth/google?origin=${encodeURIComponent(location.origin)}"><svg class="g-logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>${t('signIn')}</a>
    </div>` : `<div class="login-prompt"><div class="icon">🔐</div><div class="msg">${t('loginPromptTitle')}</div></div>`;
    return;
  }
  list.innerHTML = `<div class="loading">${t('loading')}</div>`;
  try {
    const resp = await fetch(`${API}/marks`, { credentials: 'same-origin' });
    const marks = await resp.json();
    const pending = marks.filter(m => m.status === 'pending');
    const processed = marks.filter(m => m.status === 'processed');

    let html = `<div class="mark-stats">
      <div class="mark-stat"><div class="num">${marks.length}</div><div class="label">${t('totalMarks')}</div></div>
      <div class="mark-stat"><div class="num">${processed.length}</div><div class="label">${t('deepDived')}</div></div>
      <div class="mark-stat"><div class="num" style="color:var(--arctic-aurora-amber)">${pending.length}</div><div class="label">${t('pending')}</div></div>
    </div>`;

    // View toggle
    html += `<div style="display:flex;gap:8px;margin-bottom:16px;">
      <div class="tab ${markViewMode==='topic'?'active':''}" onclick="markViewMode='topic';renderMarks()">${t('byTopic')}</div>
      <div class="tab ${markViewMode==='time'?'active':''}" onclick="markViewMode='time';renderMarks()">${t('byTime')}</div>
    </div>`;

    if (!marks.length) {
      html += `<div style="text-align:center;padding:50px 20px;">
        <div style="font-size:36px;margin-bottom:12px;">📌</div>
        <div style="font-size:18px;font-weight:600;margin-bottom:10px;">${t('emptyMarksTitle')}</div>
        <div style="color:var(--arctic-text-muted);font-size:14px;line-height:1.7;white-space:pre-line;">${t('emptyMarksDesc')}</div>
      </div>`;
    } else if (markViewMode === 'topic') {
      // Group by topic
      const topicGroups = {};
      for (const m of marks) {
        const topic = getMarkTopic(m);
        if (!topicGroups[topic]) topicGroups[topic] = [];
        topicGroups[topic].push(m);
      }
      // Sort topics by count desc
      const sortedTopics = Object.entries(topicGroups).sort((a,b) => b[1].length - a[1].length);
      for (const [topic, items] of sortedTopics) {
        html += `<div class="date-group"><div class="date-group-header">${topic} <span class="count">${items.length} ${t('items')}</span></div><div class="date-group-items">`;
        for (const m of items) html += renderMarkCard(m);
        html += `</div></div>`;
      }
    } else {
      // Group by date
      const dateGroups = {}; const dateOrder = [];
      for (const m of marks) {
        const dt = new Date(m.created_at);
        const key = dt.toISOString().slice(0, 10);
        if (!dateGroups[key]) { dateGroups[key] = []; dateOrder.push(key); }
        dateGroups[key].push(m);
      }
      for (const key of dateOrder) {
        const items = dateGroups[key];
        html += `<div class="date-group"><div class="date-group-header">📅 ${key} <span class="count">${items.length} ${t('items')}</span></div><div class="date-group-items">`;
        for (const m of items) html += renderMarkCard(m);
        html += `</div></div>`;
      }
    }
    list.innerHTML = html;
  } catch (e) {
    list.innerHTML = `<div class="empty">${t('cannotLoadMarks')}</div>`;
  }
}

function renderMarkCard(m) {
  const authorMatch = m.url.match(/x\.com\/([^/]+)/);
  const author = authorMatch ? authorMatch[1] : '?';
  const isDone = m.status === 'processed';
  const topic = getMarkTopic(m);
  const summary = m.note || '';
  return `<div class="mark-card">
    <div class="mark-meta">
      <span class="mark-author">@${author}</span>
      <span class="mark-status ${isDone ? 'done' : 'pending'}">${isDone ? t('marksDone') : t('marksPending')}</span>
    </div>
    ${summary ? `<div style="font-size:13px;color:var(--arctic-text-secondary);margin:6px 0;line-height:1.5;">${summary}</div>` : ''}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
      <a href="${m.url}" target="_blank" style="font-size:12px;color:var(--arctic-text-muted);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;">${m.url.replace('https://x.com/','x.com/')}</a>
      <div style="display:flex;gap:6px;align-items:center;">
        <span style="font-size:11px;color:var(--arctic-text-muted);background:var(--arctic-bg-elevated);padding:1px 6px;border-radius:3px;border:1px solid var(--arctic-border);">${topic}</span>
        <span class="mark-btn" onclick="doUnmark('${m.url}', ${m.id}, this)" style="font-size:11px;color:var(--arctic-aurora-red);border-color:var(--arctic-aurora-red);">✕</span>
      </div>
    </div>

}

const SOURCE_ICONS = { twitter_feed: '🐦', twitter_list: '🐦', rss: '📡', website: '🌐', hackernews: '🔶', reddit: '👽', github_trending: '⭐', custom_api: '🔌', digest_feed: '📰' };
const SOURCE_TYPES = ['twitter_feed', 'twitter_list', 'rss', 'website', 'hackernews', 'reddit', 'github_trending', 'custom_api', 'digest_feed'];
let showSourceForm = false;
let editingSource = null;

let createdByMeExpanded = false;

function parseSourceConfigObj(rawConfig) {
  try {
    const cfg = typeof rawConfig === 'string' ? JSON.parse(rawConfig) : (rawConfig || {});
    return cfg && typeof cfg === 'object' ? cfg : {};
  } catch {
    return {};
  }
}

function normalizeDigestTypes(raw) {
  const allowed = ['4h', 'daily', 'weekly', 'monthly'];
  const list = Array.isArray(raw) ? raw.filter(x => allowed.includes(x)) : [];
  const uniq = [...new Set(list)];
  return uniq.length ? uniq : ['daily'];
}

function sourceTargetLabel(type, cfg) {
  if (type === 'rss' || type === 'website' || type === 'digest_feed') return cfg.url || '';
  if (type === 'twitter_feed') return cfg.handle || '';
  if (type === 'twitter_list') return cfg.list_url || '';
  if (type === 'reddit') return cfg.subreddit ? `r/${cfg.subreddit}` : '';
  if (type === 'github_trending') return cfg.language ? `lang:${cfg.language}` : 'lang:all';
  if (type === 'hackernews') return cfg.filter ? `filter:${cfg.filter}` : 'HN';
  if (type === 'custom_api') return cfg.endpoint || '';
  return '';
}

function renderDigestTypeButtons(sourceId, digestTypes) {
  const all = ['4h', 'daily', 'weekly', 'monthly'];
  return all.map(dt => {
    const active = digestTypes.includes(dt);
    const bg = active ? 'var(--arctic-aurora-green-dim)' : 'var(--arctic-surface)';
    const border = active ? 'rgba(52,211,153,0.3)' : 'var(--arctic-border)';
    const color = active ? 'var(--arctic-aurora-green)' : 'var(--arctic-text-muted)';
    return `<button onclick="toggleSourceDigestType(${sourceId}, '${dt}')" style="padding:2px 7px;font-size:11px;background:${bg};border:1px solid ${border};border-radius:6px;color:${color};cursor:pointer;">${dt}</button>`;
  }).join('');
}

function renderSourceCard(s, opts = {}) {
  const icon = SOURCE_ICONS[s.type] || '📦';
  const lastFetch = s.last_fetched_at ? s.last_fetched_at.slice(0, 16).replace('T', ' ') : t('never');
  const cfg = parseSourceConfigObj(s.config);
  const digestTypes = normalizeDigestTypes(cfg._digestTypes);
  const target = sourceTargetLabel(s.type, cfg);
  const ingestLabel = lang === 'zh' ? '采集' : 'Ingest';
  const showToggle = opts.showToggle !== false;
  const showEdit = !!opts.showEdit;
  const showDelete = !!opts.showDelete;
  const showUnsub = !!opts.showUnsub;

  // Check if this source is being edited inline
  const isEditing = editingSource && String(editingSource.id) === String(s.id);

  if (isEditing) {
    console.log(`Rendering inline form placeholder for source ${s.id}`);
    // Render inline edit form
    return `<div class="source-card" id="source-card-${s.id}" style="padding:12px 16px;">
      <div id="inline-form-${s.id}"></div>
    </div>`;
  }

  return `<div class="source-card" id="source-card-${s.id}" style="padding:12px 16px;">
    <div class="source-header">
      <span class="source-name" style="font-size:14px;">${icon} ${s.name}${s.is_public ? ' <span style="font-size:11px;color:var(--arctic-text-muted);font-weight:400;">🌐</span>' : ''}
        <span style="font-size:11px;color:var(--arctic-accent);background:var(--arctic-accent-dim);padding:1px 6px;border-radius:3px;margin-left:4px;">${s.type}</span>
        ${s.group_name ? ` <span style="font-size:11px;color:var(--arctic-aurora-green);background:var(--arctic-aurora-green-dim);padding:1px 6px;border-radius:3px;margin-left:4px;" title="Group: ${s.group_name}">🏷️ ${s.group_name}</span>` : ''}
      </span>
      <div class="source-actions" style="gap:6px;">
        ${showToggle ? `<label class="toggle-switch" title="Active"><input type="checkbox" ${s.is_active ? 'checked' : ''} onchange="toggleSource(${s.id}, this.checked)"><span class="toggle-slider"></span></label>` : ''}
        ${showUnsub ? `<button class="danger" onclick="unsubSource(${s.id})" style="font-size:11px;padding:3px 8px;" title="${lang==='zh'?'退订':'Unsubscribe'}">✕</button>` : ''}
        ${showEdit ? `<button onclick="editSourceInline(${s.id})" style="font-size:11px;padding:3px 8px;">${t('editSource')}</button>` : ''}
        ${showDelete ? `<button class="danger" onclick="delSource(${s.id})" style="font-size:11px;padding:3px 8px;">${t('deleteSource')}</button>` : ''}
      </div>
    </div>
    <div class="source-meta" style="font-size:11px;">
      <span>${t('lastFetched')}: ${lastFetch}</span>
      ${target ? `<span style="color:var(--arctic-text-muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${target}">${target}</span>` : ''}
      <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span>${ingestLabel}:</span>
        <span style="display:inline-flex;gap:4px;flex-wrap:wrap;">${renderDigestTypeButtons(s.id, digestTypes)}</span>
      </span>
    </div>
  </div>`;
}

async function toggleSourceDigestType(sourceId, digestType) {
  const allowed = ['4h', 'daily', 'weekly', 'monthly'];
  if (!allowed.includes(digestType)) return;
  try {
    const src = await apiFetchJson(`${API}/sources/${sourceId}`, { credentials: 'same-origin' });
    const cfg = parseSourceConfigObj(src.config);
    let digestTypes = normalizeDigestTypes(cfg._digestTypes);
    if (digestTypes.includes(digestType)) {
      if (digestTypes.length === 1) {
        showToast(lang === 'zh' ? '至少保留一个采集周期' : 'Keep at least one ingestion type');
        return;
      }
      digestTypes = digestTypes.filter(t => t !== digestType);
    } else {
      digestTypes.push(digestType);
    }
    cfg._digestTypes = digestTypes;
    await apiFetchJson(`${API}/sources/${sourceId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ config: JSON.stringify(cfg) })
    });
    showToast((lang === 'zh' ? '采集周期已更新: ' : 'Ingestion updated: ') + digestTypes.join(', '));
    renderSources();
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

function renderDeletedSourceCard(s) {
  const icon = SOURCE_ICONS[s.type] || '📦';
  return `<div class="source-card" style="padding:12px 16px;opacity:0.4;pointer-events:none;filter:grayscale(1);">

      </span>

    <div class="source-meta" style="font-size:11px;">
      <span style="color:var(--arctic-text-muted);">${s.type}</span>
    </div>
  </div>`;
}

// Note: renderScheduleBar builds static HTML from trusted server data (group schedule JSON).
// The schedule data structure {at: ["HH:MM"], on: "day"} is validated by the backend.
function renderScheduleBar(schedule) {
  let s;
  try { s = typeof schedule === 'object' ? schedule : JSON.parse(schedule || '{}'); } catch { return ''; }
  if (!s?.at?.length) return '<div style="font-size:12px;color:var(--arctic-text-muted);margin-top:6px;font-style:italic;">No schedule configured</div>';

  const activeHours = new Set();
  for (const t of s.at) {
    const h = parseInt(t.split(':')[0], 10);
    if (!isNaN(h)) activeHours.add(h);
  }

  let barHtml = '<div class="schedule-bar">';
  for (let h = 0; h < 24; h++) {
    const isActive = activeHours.has(h);
    const pad = String(h).padStart(2, '0');
    barHtml += '<div class="hour-slot ' + (isActive ? 'active' : '') + '" title="' + pad + ':00' + (isActive ? ' - Scheduled' : '') + '"></div>';
  }
  barHtml += '</div>';
  barHtml += '<div class="schedule-bar-labels">';
  for (let h = 0; h < 24; h++) {
    barHtml += '<span>' + (h % 3 === 0 ? h : '') + '</span>';
  }
  barHtml += '</div>';
  if (s.on) {
    barHtml += '<div class="schedule-day-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ' + esc(s.on) + '</div>';
  }
  return barHtml;
}

async function saveGroup() {
  const name = document.getElementById('group_name').value.trim();
  const description = document.getElementById('group_desc').value.trim();
  const timezone = document.getElementById('group_timezone').value;
  const digestTypes = [];
  if (document.getElementById('digest_4h').checked) digestTypes.push('4h');
  if (document.getElementById('digest_daily').checked) digestTypes.push('daily');
  if (document.getElementById('digest_weekly').checked) digestTypes.push('weekly');
  if (document.getElementById('digest_monthly').checked) digestTypes.push('monthly');

  // Build schedule from interactive hour-bar
  let schedule = {};
  const activeSlots = document.querySelectorAll('#scheduleBarEdit .hour-cell.active');
  if (activeSlots.length) {
    schedule.at = Array.from(activeSlots).map(el => String(el.dataset.hour).padStart(2, '0') + ':00');
  }
  const dayVal = document.getElementById('group_schedule_day')?.value;
  if (dayVal) schedule.on = dayVal;
  const tgThreadRaw = document.getElementById('group_tg_thread')?.value.trim();
  const tgChatRaw   = document.getElementById('group_tg_chat')?.value.trim();
  const telegram_thread_id = tgThreadRaw ? parseInt(tgThreadRaw, 10) : null;
  const telegram_chat_id   = tgChatRaw || null;
  const promptIdRaw = document.getElementById('group_prompt_id')?.value;
  const prompt_id = promptIdRaw ? parseInt(promptIdRaw, 10) : null;

  if (!name) { showToast('Name required'); return; }

  try {
    const method = currentGroupEdit ? 'PUT' : 'POST';
    const url = currentGroupEdit ? `${API}/groups/${currentGroupEdit.id}` : `${API}/groups`;
    await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ name, description, timezone, digestTypes, schedule, telegram_thread_id, telegram_chat_id, prompt_id })
    });
    showToast(currentGroupEdit ? t('groupUpdated') : t('groupCreated'));
    hideGroupForm();
    renderGroups();
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

async function savePrompt(id) {
  const name = document.getElementById('prompt_name').value.trim();
  const content = document.getElementById('prompt_content').value;
  if (!name || !content) { showToast('Name and content are required'); return; }

  try {
    if (id) {
      await fetch(API + '/prompts/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ name, content })
      });

      await fetch(API + '/prompts', {

  try {

    showToast(t('promptDeleted'));
    renderPrompts();
  } catch (e) {
    showToast('Error: ' + e.message);

async function detectSource() {
  const input = document.getElementById('smart_url');
  const url = (input?.value || '').trim();
  if (!url) return;
  smartAddState = 'loading';
  resolvedSource = null;
  renderSmartAdd();
  try {
    const r = await fetch(`${API}/sources/resolve`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ url }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'failed');
    resolvedSource = data;
    smartAddState = 'preview';
  } catch (e) {
    smartAddState = 'error';
    smartAddError = e.message;
  }
  renderSmartAdd();
}

async function confirmSmartAdd() {
  if (!resolvedSource) return;
  const isPublic = document.getElementById('smart_public')?.checked || false;
  const digestTypes = ['4h', 'daily', 'weekly', 'monthly'].filter(dt => document.getElementById(`smart_dt_${dt === '4h' ? '4h' : dt}`)?.checked);
  if (!digestTypes.length) {
    showToast(lang === 'zh' ? '请至少选择一个采集周期' : 'Select at least one ingestion type');
    return;
  }
  try {
    const cfg = { ...(resolvedSource.config || {}), _digestTypes: digestTypes };
    await apiFetchJson(`${API}/sources`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ name: resolvedSource.name, type: resolvedSource.type, config: JSON.stringify(cfg), isPublic }) });
    showToast(`${t('sourceCreated')}: ${resolvedSource.name}`);
    smartAddState = 'input'; resolvedSource = null;
    renderSources();
  } catch (e) { showToast('Error: ' + e.message); }
}

async function editSourceInline(id) {
  try {
    console.log(`editSourceInline called with id=${id}`);

    // Save scroll position before re-render
    const scrollY = window.scrollY;
    const cardElement = document.getElementById(`source-card-${id}`);
    const cardOffsetTop = cardElement ? cardElement.offsetTop : 0;

    editingSource = await apiFetchJson(`${API}/sources/${id}`, { credentials: 'same-origin' });
    console.log('editingSource loaded:', editingSource);
    showSourceForm = false; // Don't show bottom form
    renderSources(); // Re-render to show inline form placeholder

    // Restore scroll position after re-render
    window.scrollTo(0, scrollY);

    // Wait for container to exist in DOM (with timeout)
    const waitForContainer = () => {
      return new Promise((resolve) => {
        let attempts = 0;
        const checkContainer = () => {
          const container = document.getElementById(`inline-form-${id}`);
          if (container) {
            console.log(`Container found after ${attempts} attempts`);
            resolve();
          } else if (attempts++ < 50) { // Try for ~500ms
            requestAnimationFrame(checkContainer);
          } else {
            console.error('Container not found after timeout');
            resolve(); // Continue anyway to trigger error handling
          }
        };
        requestAnimationFrame(checkContainer);
      });
    };

    await waitForContainer();
    await renderInlineSourceForm(id);

    // Scroll to the editing card to keep it in view
    requestAnimationFrame(() => {
      const editCard = document.getElementById(`source-card-${id}`);
      if (editCard) {
        editCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  } catch (e) {
    showToast('Error: ' + e.message);
    console.error('Edit inline error:', e);
  }
}

async function saveSourceInline(sourceId) {
  const name = document.getElementById('inline_sf_name').value.trim();
  const type = document.getElementById('inline_sf_type').value;
  const groupId = document.getElementById('inline_sf_group').value;
  const configText = document.getElementById('inline_sf_config').value.trim();
  const isPublic = document.getElementById('inline_sf_public').checked;
  const digestTypes = ['4h', 'daily', 'weekly', 'monthly'].filter(dt => document.getElementById(`inline_sf_dt_${dt === '4h' ? '4h' : dt}`)?.checked);

  if (!name) return;
  if (!digestTypes.length) {
    showToast(lang === 'zh' ? '请至少选择一个采集周期' : 'Select at least one ingestion type');
    return;
  }

  let cfgObj;
  try { cfgObj = JSON.parse(configText); } catch { showToast('Invalid JSON config'); return; }
  if (!cfgObj || typeof cfgObj !== 'object' || Array.isArray(cfgObj)) cfgObj = {};

  const prevCfg = parseSourceConfigObj(editingSource?.config);
  if (prevCfg._configId && !cfgObj._configId) cfgObj._configId = prevCfg._configId;
  cfgObj._digestTypes = digestTypes;
  const config = JSON.stringify(cfgObj);

  try {
    const payload = { name, type, config, isPublic };
    if (groupId) payload.groupId = parseInt(groupId);

    // Save scroll position before re-render
    const scrollY = window.scrollY;

    await apiFetchJson(`${API}/sources/${sourceId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(payload)
    });
    showToast(t('sourceUpdated'));
    editingSource = null;
    renderSources();

    // Restore scroll position after re-render
    requestAnimationFrame(() => {
      window.scrollTo(0, scrollY);
    });
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

function cancelInlineEdit() {
  // Save scroll position before re-render
  const scrollY = window.scrollY;

  editingSource = null;
  renderSources();

  // Restore scroll position after re-render
  requestAnimationFrame(() => {
    window.scrollTo(0, scrollY);
  });
}

function onTypeChange() {

function renderSourceForm() {

  delete cleanCfg._digestTypes;
  delete cleanCfg._configId;
  const typeOptions = SOURCE_TYPES.map(t => `<option value="${t}" ${s && s.type === t ? 'selected' : ''}>${SOURCE_ICONS[t] || ''} ${t}</option>`).join('');

async function saveSource() {
  const name = document.getElementById('sf_name').value.trim();
  const type = document.getElementById('sf_type').value;
  const configText = document.getElementById('sf_config').value.trim();
  const isPublic = document.getElementById('sf_public').checked;
  const digestTypes = ['4h', 'daily', 'weekly', 'monthly'].filter(dt => document.getElementById(`sf_dt_${dt === '4h' ? '4h' : dt}`)?.checked);
  if (!name) return;
  if (!digestTypes.length) {
    showToast(lang === 'zh' ? '请至少选择一个采集周期' : 'Select at least one ingestion type');
    return;
  }
  let cfgObj;
  try { cfgObj = JSON.parse(configText); } catch { showToast('Invalid JSON config'); return; }
  if (!cfgObj || typeof cfgObj !== 'object' || Array.isArray(cfgObj)) cfgObj = {};
  const prevCfg = parseSourceConfigObj(editingSource?.config);
  if (prevCfg._configId && !cfgObj._configId) cfgObj._configId = prevCfg._configId;
  cfgObj._digestTypes = digestTypes;
  const config = JSON.stringify(cfgObj);
  try {
    if (editingSource) {
      await apiFetchJson(`${API}/sources/${editingSource.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ name, type, config, isPublic }) });
      showToast(t('sourceUpdated'));
    } else {
      await apiFetchJson(`${API}/sources`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ name, type, config, isPublic }) });
      showToast(t('sourceCreated'));
    }
    showSourceForm = false; editingSource = null;
    renderSources();
  } catch (e) { showToast('Error: ' + e.message); }
}

async function loadMarkedUrls() {
  if (!currentUser) return;
  try {
    const r = await fetch(`${API}/marks`, { credentials: 'same-origin' });
    if (r.ok) {
      const marks = await r.json();
      marks.forEach(m => markedUrls.set(m.url, m.id));
    }
  } catch {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function doMark(url, btn) {
  try {
    const r = await fetch(`${API}/marks`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ url })
    });
    const d = await r.json();
    if (d.ok) {
      // Reload marks to get the new mark id
      const mr = await fetch(`${API}/marks`, { credentials: 'same-origin' });
      if (mr.ok) { const marks = await mr.json(); markedUrls.clear(); marks.forEach(m => markedUrls.set(m.url, m.id)); }
      const newId = markedUrls.get(url);
      btn.textContent = t('marked');
      btn.classList.add('marked');
      btn.onclick = () => doUnmark(url, newId, btn);
      showToast(d.duplicate ? t('markDup') : t('markSuccess'));
    }
  } catch (e) { showToast(t('markFail') + ': ' + e.message); }
}

async function doUnmark(url, markId, btn) {
  if (!confirm(lang === 'zh' ? '确定取消收藏？' : 'Remove this mark?')) return;
  try {
    const r = await fetch(`${API}/marks/${markId}`, { method: 'DELETE', credentials: 'same-origin' });
    const d = await r.json();
    if (d.ok) {
      markedUrls.delete(url);
      btn.textContent = t('mark');
      btn.classList.remove('marked');
      btn.onclick = () => doMark(url, btn);
      showToast(lang === 'zh' ? '已取消收藏' : 'Unmarked');
      if (currentType === 'marks') renderMarks();
    }
  } catch (e) { showToast('❌ ' + e.message); }
}

async function installPack(slug, btn) {
  if (btn.classList.contains('done')) return;
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const r = await fetch(`${API}/packs/${slug}/install`, { method: 'POST', credentials: 'same-origin' });
    const d = await r.json();
    if (d.ok) {
      let msg = t('packInstalled');
      if (d.added > 0) msg += ` ${d.added} ${t('newAdded')}`;
      if (d.skipped > 0) msg += `, ${d.skipped} ${t('skipped')}`;
      showToast(msg);
      // Force refresh sources view so user sees their new subscriptions
      currentType = 'sources';
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      await renderSources();
    } else {
      showToast(d.error || 'Error');
      btn.textContent = t('installPack');
      btn.disabled = false;
    }
  } catch (e) {
    showToast('Error: ' + e.message);
    btn.textContent = t('installPack');
    btn.disabled = false;
  }
}

        </div>`).join('')}
      </div>
    </div>`;
    list.innerHTML = html;
  } catch (e) {
    list.innerHTML = `<div class="empty">Failed: ${e.message}</div>`;
  }
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelector('.tab.active')?.classList.remove('active');
    tab.classList.add('active');
    currentType = tab.dataset.type;
    currentOffset = 0; allLoaded = false;
    location.hash = currentType;
    document.getElementById('viewer').style.display = 'none';
    renderList();
  };
});

if (location.hash) {
  const h = location.hash.substring(1);
  if (['4h','daily','weekly','monthly','marks','sources','groups','settings'].includes(h)) {
    currentType = h;
    document.querySelector('.tab.active')?.classList.remove('active');
    const t = document.querySelector('.tab[data-type="'+h+'"]');
    if (t) t.classList.add('active');
  } else if (h.startsWith('pack/')) {
    currentPackSlug = h.slice(5);
  }
}

document.addEventListener('click', (e) => {
  document.querySelectorAll('.user-dropdown.show').forEach(dd => {
    if (!e.target.closest('.user-menu')) dd.classList.remove('show');
  });
});
applyLang();

// ── Feedback Chat Bubble ──
(async function() {
  const style = document.createElement('style');
  style.textContent = `
    .fb-bubble { position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%; background:var(--arctic-accent); border:none; cursor:pointer; font-size:24px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(56,189,248,.3); z-index:1000; transition:transform .2s; }
    .fb-bubble:hover { transform:scale(1.1); }
    .fb-bubble .fb-dot { position:absolute; top:2px; right:2px; width:12px; height:12px; background:var(--arctic-aurora-red); border-radius:50%; display:none; border:2px solid var(--arctic-bg); }
    body.light .fb-bubble .fb-dot { border-color:var(--arctic-bg); }
    .fb-panel { position:fixed; bottom:90px; right:24px; width:320px; height:400px; background:var(--arctic-bg-elevated); border:1px solid var(--arctic-border); border-radius:12px; z-index:1001; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,.4); transform:translateY(20px); opacity:0; pointer-events:none; transition:transform .25s ease, opacity .25s ease; }
    .fb-panel.open { transform:translateY(0); opacity:1; pointer-events:auto; }
    body.light .fb-panel { background:var(--arctic-bg-elevated); border-color:var(--arctic-border); }
    .fb-header { padding:12px 16px; border-bottom:1px solid var(--arctic-border); display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:600; }
    body.light .fb-header { border-color:var(--arctic-border); color:var(--arctic-text); }
    .fb-close { background:none; border:none; color:var(--arctic-text-muted); cursor:pointer; font-size:18px; padding:0 4px; }
    .fb-close:hover { color:#fff; }
    body.light .fb-close:hover { color:#333; }
    .fb-messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
    .fb-msg { max-width:85%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.5; word-break:break-word; }
    .fb-msg.user { align-self:flex-end; background:var(--arctic-accent-dim); color:var(--arctic-text); border:1px solid rgba(56,189,248,0.12); border-bottom-right-radius:4px; }
    .fb-msg.reply { align-self:flex-start; background:var(--arctic-surface); color:var(--arctic-text-secondary); border:1px solid var(--arctic-border); border-bottom-left-radius:4px; }
    body.light .fb-msg.user { background:var(--arctic-accent-dim); color:var(--arctic-text); }
    body.light .fb-msg.reply { background:var(--arctic-surface); color:var(--arctic-text); }
    .fb-msg .fb-time { font-size:10px; color:var(--arctic-text-muted); margin-top:4px; }
    .fb-empty { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; color:var(--arctic-text-muted); font-size:13px; line-height:1.6; }
    .fb-input { padding:10px 12px; border-top:1px solid var(--arctic-border); display:flex; flex-direction:column; gap:6px; }
    body.light .fb-input { border-color:var(--arctic-border); }
    .fb-input textarea { width:100%; resize:none; background:var(--arctic-input-bg); border:1px solid var(--arctic-border); border-radius:8px; color:var(--arctic-text); padding:8px 10px; font-size:13px; font-family:inherit; height:60px; }
    body.light .fb-input textarea { background:var(--arctic-input-bg); border-color:var(--arctic-border); color:var(--arctic-text); }
    .fb-input textarea:focus { outline:none; border-color:var(--arctic-accent); box-shadow:0 0 0 2px rgba(56,189,248,0.1); }
    .fb-input input { width:100%; background:var(--arctic-input-bg); border:1px solid var(--arctic-border); border-radius:6px; color:var(--arctic-text); padding:6px 10px; font-size:12px; font-family:inherit; }
    body.light .fb-input input { background:var(--arctic-input-bg); border-color:var(--arctic-border); color:var(--arctic-text); }
    .fb-input input:focus { outline:none; border-color:var(--arctic-accent); }
    .fb-send { padding:6px 16px; background:var(--arctic-accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; align-self:flex-end; transition:all .2s; }
    .fb-send:hover { background:#0ea5e9; box-shadow:0 0 12px rgba(56,189,248,0.3); }
    .fb-send:disabled { opacity:.5; cursor:default; }
    @media (max-width:480px) { .fb-panel { left:12px; right:12px; width:auto; bottom:84px; height:60vh; } .fb-bubble { bottom:16px; right:16px; } }
  `;
  document.head.appendChild(style);

  // Check if feedback is enabled via API config
  try {
    const fcfg = await fetch(`${API}/config`).then(r => r.json()).catch(() => ({}));
    if (fcfg.feedbackEnabled === false) return; // Don't show bubble
  } catch {}

  const bubble = document.createElement('button');
  bubble.className = 'fb-bubble';
  bubble.innerHTML = '💬<span class="fb-dot"></span>';
  document.body.appendChild(bubble);

  const panel = document.createElement('div');
  panel.className = 'fb-panel';
  panel.innerHTML = `
    <div class="fb-header"><span class="fb-title"></span><button class="fb-close">×</button></div>
    <div class="fb-messages"></div>
    <div class="fb-input">
      <div class="fb-anon-fields" style="display:none;"><input class="fb-email" type="email"><input class="fb-name" style="margin-top:4px;"></div>
      <textarea class="fb-text"></textarea>
      <button class="fb-send"></button>
    </div>`;
  document.body.appendChild(panel);

  let fbOpen = false, fbLoaded = false, fbLastCount = 0;

  function fbUpdateI18n() {
    panel.querySelector('.fb-title').textContent = t('feedbackTitle');
    panel.querySelector('.fb-text').placeholder = t('feedbackPlaceholder');
    panel.querySelector('.fb-email').placeholder = t('feedbackEmailPlaceholder');
    panel.querySelector('.fb-name').placeholder = t('feedbackNamePlaceholder');
    panel.querySelector('.fb-send').textContent = t('feedbackSend');
  }

  function fbRender(items) {
    const msgs = panel.querySelector('.fb-messages');
    if (!items.length) {
      msgs.innerHTML = `<div class="fb-empty">${t('feedbackEmpty')}</div>`;
      return;
    }
    msgs.innerHTML = items.map(m => {
      let html = `<div class="fb-msg user">${esc(m.message)}<div class="fb-time">${m.created_at}</div></div>`;
      if (m.reply) html += `<div class="fb-msg reply">${esc(m.reply)}<div class="fb-time">${m.replied_at || ''}</div></div>`;
      return html;
    }).join('');
    msgs.scrollTop = msgs.scrollHeight;
    // Check unread
    const replied = items.filter(i => i.reply).length;
    if (replied > fbLastCount) panel.querySelector('.fb-dot')?.style && (bubble.querySelector('.fb-dot').style.display = 'block');
    fbLastCount = replied;
  }

  async function fbLoad() {
    try {
      const r = await fetch(`${API}/feedback`, { credentials:'same-origin' });
      const items = await r.json();
      fbRender(Array.isArray(items) ? items : []);
      fbLoaded = true;
    } catch { fbRender([]); }
  }

  bubble.onclick = () => {
    fbOpen = !fbOpen;
    panel.classList.toggle('open', fbOpen);
    if (fbOpen) {
      fbUpdateI18n();
      // Show anon fields if not logged in
      panel.querySelector('.fb-anon-fields').style.display = currentUser ? 'none' : 'block';
      if (!fbLoaded || currentUser) fbLoad();
      bubble.querySelector('.fb-dot').style.display = 'none';
    }
  };
  panel.querySelector('.fb-close').onclick = () => { fbOpen = false; panel.classList.remove('open'); };

  panel.querySelector('.fb-send').onclick = async () => {
    const text = panel.querySelector('.fb-text').value.trim();
    if (!text) return;
    const btn = panel.querySelector('.fb-send');
    btn.disabled = true;
    const body = { message: text };
    if (!currentUser) {
      const email = panel.querySelector('.fb-email').value.trim();
      const name = panel.querySelector('.fb-name').value.trim();
      if (email) body.email = email;
      if (name) body.name = name;
    }
    try {
      const r = await fetch(`${API}/feedback`, { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const d = await r.json();
      if (d.ok) {
        panel.querySelector('.fb-text').value = '';
        showToast(t('feedbackSent'));
        if (currentUser) fbLoad();
        else {
          // For anon, just show the sent message
          const msgs = panel.querySelector('.fb-messages');
          const empty = msgs.querySelector('.fb-empty');
          if (empty) empty.remove();
          msgs.insertAdjacentHTML('beforeend', `<div class="fb-msg user">${esc(text)}<div class="fb-time">just now</div></div>`);
          msgs.scrollTop = msgs.scrollHeight;
        }
      }
    } catch {}
    btn.disabled = false;
  };

  // Send on Ctrl+Enter
  panel.querySelector('.fb-text').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { panel.querySelector('.fb-send').click(); }
  });

  // Periodically check for new replies (every 60s when panel open)
  setInterval(() => { if (fbOpen && currentUser) fbLoad(); }, 60000);
})();

// Detect /pack/:slug URL
const packPageMatch = location.pathname.match(/\/pack\/([a-z0-9_-]+)/);
fetch(`${API}/settings`).then(r => r.json()).then(s => {
  if (s.global_timezone) appTimezone = s.global_timezone;
}).catch(() => {}).finally(() => {
  checkAuth().then(() => {
    if (packPageMatch) {
      renderPackDetailPage(packPageMatch[1]);
    } else if (currentPackSlug) {
      renderPackDetailPage(currentPackSlug);
    } else {
      renderList();
    }
  });
});

// ClawMark — only on staging
if (location.pathname.startsWith('/staging/')) {
  const cmScript = document.createElement('script');
  cmScript.type = 'module';
  cmScript.textContent = `
    import ClawMark from '/widget/index.js';
    const cm = new ClawMark({
      api: location.origin + '/api/clawmark',
      app: 'staging-clawfeed',
      user: (document.querySelector('.user-name')?.textContent || 'guest').trim()
    });
    cm.use(ClawMark.Fab);
    cm.mount();
  `;
  document.body.appendChild(cmScript);
}
</script>
